dbt_imdb:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      user: "{{ env_var('POSTGRES_USER', 'imdb_user') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'imdb_password') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      dbname: "{{ env_var('POSTGRES_DB', 'imdb_dwh') }}"
      schema: dbt_staging
      threads: 4
      keepalives_idle: 0
